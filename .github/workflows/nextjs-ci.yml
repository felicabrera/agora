name: Next.js CI

# Same approach as go-ci.yml: no `paths:` filters, the job always runs and
# detects internally whether a Next.js app exists in `web/`. If it does not, the
# job reports success without running any analysis. Third-party actions are
# pinned by commit SHA, with the readable tag kept as a comment.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect Next.js app
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "has_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No web/package.json found; the job reports success without running analysis."
          fi

      - name: Setup Node
        if: steps.detect.outputs.has_web == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.detect.outputs.has_web == 'true'
        working-directory: ./web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_web == 'true'
        working-directory: ./web
        run: npm run lint

      - name: Build
        if: steps.detect.outputs.has_web == 'true'
        working-directory: ./web
        run: npm run build

      - name: npm audit (dependency vulnerabilities)
        if: steps.detect.outputs.has_web == 'true'
        working-directory: ./web
        run: npm audit --audit-level=high
