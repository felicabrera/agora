name: Deploy

# Ships agora-api to the apps host: development to agora-test.felicabrera.com, main to
# agora.felicabrera.com. Each branch deploys through its own GitHub Environment
# (test / production), which holds the per-environment secrets (image/container names and host port).
#
# The job runs on a self-hosted runner on the apps host (label "agora",
# user agora-deploy, repo-scoped), so docker compose runs locally against
# /opt/pfg/agora/<test|prod>/release. nginx lives on the separate edge host:
# the vhost is staged there over SSH as agora-deploy, whose sudo is pinned to
# /usr/local/sbin/agora-sync-nginx. The key and host key are repo secrets.
#
# Secrets are only ever read into env: at the step that needs them, never
# interpolated straight into a run: script, so a secret value can't be
# reinterpreted as shell syntax.
on:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EDGE_HOST: 10.10.10.2

jobs:
  deploy:
    runs-on: [self-hosted, agora]
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    env:
      RELEASE_DIR: /opt/pfg/agora/${{ github.ref_name == 'main' && 'prod' || 'test' }}/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync source to the release directory
        run: |
          rsync -a --delete \
            --exclude '.git' \
            ./ "$RELEASE_DIR/"

      - name: Build and start the container
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          HOST_BIND: 10.10.10.20
        run: |
          docker compose -f "$RELEASE_DIR/docker-compose.yml" --project-directory "$RELEASE_DIR" \
            -p "$PROJECT_NAME" up -d --build --remove-orphans

      - name: Install the nginx vhost
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            main) domain="agora.felicabrera.com" ;;
            development) domain="agora-test.felicabrera.com" ;;
            *) echo "unexpected ref: $REF_NAME" >&2; exit 1 ;;
          esac
          key="$RUNNER_TEMP/edge_key"
          known="$RUNNER_TEMP/edge_known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$key")
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$known"
          ssh_opts=(-i "$key" -o UserKnownHostsFile="$known" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp "${ssh_opts[@]}" "deploy/nginx/$domain.conf" "agora-deploy@$EDGE_HOST:$domain.conf.new"
          ssh "${ssh_opts[@]}" "agora-deploy@$EDGE_HOST" \
            "sudo -n /usr/local/sbin/agora-sync-nginx $domain; status=\$?; rm -f $domain.conf.new; exit \$status"
