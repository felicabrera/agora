name: Go CI

# No `paths:` filters. A job filtered by `paths` never reports a conclusion on
# PRs that do not touch those files, so requiring it as a mandatory status check
# would block the PR forever. Instead the job always runs and detects internally
# whether there is Go code. If there is none, it reports success without running
# any analysis.
#
# Third-party actions are pinned by commit SHA rather than by tag. A tag is a
# mutable reference and can be repointed at different code. In a project whose
# central argument is verifiable integrity, the pipeline that produces the
# artifacts has to be reproducible. The readable tag is kept as a comment.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect Go code
        id: detect
        run: |
          if [ -f go.mod ] || [ -n "$(find . -name '*.go' -not -path './.git/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Go code found in the repository; the job reports success without running analysis."
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: ${{ hashFiles('**/go.sum') != '' }}

      - name: Vet
        if: steps.detect.outputs.has_go == 'true'
        run: go vet ./...

      - name: Lint (golangci-lint)
        if: steps.detect.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test with race detector and coverage
        if: steps.detect.outputs.has_go == 'true'
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report
        if: steps.detect.outputs.has_go == 'true'
        run: go tool cover -func=coverage.out

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect Go code
        id: detect
        run: |
          if [ -f go.mod ] || [ -n "$(find . -name '*.go' -not -path './.git/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Go code found in the repository; the job reports success without running analysis."
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: gosec (static security analysis)
        if: steps.detect.outputs.has_go == 'true'
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: './...'

      - name: govulncheck (known vulnerabilities in dependencies)
        if: steps.detect.outputs.has_go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...
