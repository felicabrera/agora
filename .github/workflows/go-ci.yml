name: Go CI

# Sin filtros `paths:`. Un job filtrado por `paths` nunca reporta conclusión en
# los PRs que no tocan esos archivos, y si se lo exige como status check
# obligatorio el PR queda bloqueado para siempre. En su lugar el job siempre
# corre y detecta internamente si hay código Go: si no lo hay, reporta éxito
# sin ejecutar nada.
#
# Las acciones de terceros se fijan por SHA de commit, no por tag: un tag es
# una referencia mutable y puede reapuntarse a otro código. En un proyecto cuyo
# argumento central es la integridad verificable, el pipeline que produce los
# artefactos tiene que ser reproducible. El tag legible va como comentario.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detectar código Go
        id: detect
        run: |
          if [ -f go.mod ] || [ -n "$(find . -name '*.go' -not -path './.git/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No se encontró código Go en el repositorio; el job reporta éxito sin ejecutar análisis."
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: ${{ hashFiles('**/go.sum') != '' }}

      - name: Vet
        if: steps.detect.outputs.has_go == 'true'
        run: go vet ./...

      - name: Lint (golangci-lint)
        if: steps.detect.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test con race detector + coverage
        if: steps.detect.outputs.has_go == 'true'
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report
        if: steps.detect.outputs.has_go == 'true'
        run: go tool cover -func=coverage.out

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detectar código Go
        id: detect
        run: |
          if [ -f go.mod ] || [ -n "$(find . -name '*.go' -not -path './.git/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No se encontró código Go en el repositorio; el job reporta éxito sin ejecutar análisis."
          fi

      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: gosec (análisis de seguridad estático)
        if: steps.detect.outputs.has_go == 'true'
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: './...'

      - name: govulncheck (vulnerabilidades conocidas en dependencias)
        if: steps.detect.outputs.has_go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...
