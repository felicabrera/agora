# Dependabot version updates.
#
# Security updates are not configured here. They are already enabled at
# repository level (Dependabot alerts plus automated security fixes) and fire on
# their own whenever an advisory affects the project.
#
# Every ecosystem present in the repository is monitored. Adding a manifest for
# a new one (npm, docker) means adding a block here in the same change, or the
# new dependency tree goes unwatched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Do not accept a brand new release the moment it is published. A
    # compromised package is usually caught within days, and this window lets
    # that happen before the update reaches a PR here. Security updates are
    # explicitly exempt from cooldown, so vulnerability fixes still arrive
    # immediately.
    #
    # Only `default-days` is valid for the github-actions ecosystem. The
    # `semver-*-days` keys are rejected here and are only accepted by
    # semver-aware ecosystems such as gomod and npm.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "go"]
    # Minor and patch bumps are grouped into one PR. Reviewing twelve
    # near-identical version bumps separately is how a malicious one gets waved
    # through; major bumps stay separate because they deserve individual thought.
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
