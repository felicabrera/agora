language: "en"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Review is opt-out, never opt-in. A PR with no label still gets reviewed.
    # Opt-in by label would mean an unlabelled PR silently gets no review while
    # its status check still reports green, which is worse than no check at all.
    labels:
      - "!skip-review"
    # Dependabot PRs are already covered by Dependabot itself, CodeQL and CI.
    # Excluding them keeps review quota for changes that need human judgement.
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # Do not re-run a full review on every push. Without this, a PR that takes
    # several rounds of fixes burns one review per push and exhausts the rate
    # limit. Request a re-review with `@coderabbitai review` when ready.
    auto_incremental_review: false
  path_instructions:
    - path: "crypto/**"
      instructions: >
        This code implements ElGamal homomorphic encryption, zero-knowledge
        proofs (Schnorr / Bulletproofs) and threshold decryption for an
        electronic voting system. Flag any deviation from constant-time
        operations, weak or non-cryptographic randomness sources (`math/rand`
        instead of `crypto/rand`), missing validation of curve points or group
        elements received from outside, nonce reuse, and any logic that could
        leak information about vote plaintext (secret-dependent branching or
        memory access, distinguishable error messages, timing differences).
        Treat any change here as high risk.
    - path: "cmd/**"
      instructions: >
        Service entry points. Flag anything that publishes, accepts or discards
        data without the check that authorises it, secrets read into a place
        they can be logged, missing request timeouts, and error responses to
        unauthenticated callers that distinguish failure modes finely enough to
        act as an oracle.
    - path: "internal/faro/**"
      instructions: >
        Client for FARO, the append-only Merkle-tree-based public audit log.
        ÁGORA is a client of FARO, not a peer: flag anything read back from the
        log that is trusted without cryptographic verification, in particular a
        checkpoint accepted without checking its signature against a pinned
        origin, or an inclusion or consistency proof whose result is not
        actually compared against a verified root.
    - path: ".github/**"
      instructions: >
        CI/CD and governance configuration. Flag workflow permissions broader
        than necessary, mutable references to third-party actions (floating
        tags or `@master` instead of a pinned tag or SHA), and any exposure of
        secrets in logs or in workflows that run on fork pull requests.
chat:
  auto_reply: true
